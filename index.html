<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ana Paula</title>
    <link rel="shortcut icon" href="assets/img/icones/Icon.ico" type="image/x-icon">
    <meta name="theme-color" content="#0f172a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="coracoes" aria-hidden="true"></div>

    <main>
        <div class="coracao-grande" aria-hidden="true">❤️</div>

        <h1>UMA NOVA ATUALIZAÇÃO ESTÁ POR VIR<br>AGUARDE</h1>

        <p class="frase">
            Estou preparando algo feito com todo o carinho para a pessoa mais especial da minha vida.
        </p>

        <div class="timer-grid" id="temporizador">
            <div class="timer-box"><span id="dias">00</span><small>dias</small></div>
            <div class="timer-box"><span id="horas">00</span><small>horas</small></div>
            <div class="timer-box"><span id="minutos">00</span><small>minutos</small></div>
            <div class="timer-box"><span id="segundos">00</span><small>segundos</small></div>
        </div>

        <p class="frase-final" id="frase-final">Cada segundo de espera vale a pena, meu amor. 💚</p>
    </main>

    <script src="assets/js/contagem.js"></script>
</body>
</html>
